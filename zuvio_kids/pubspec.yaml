name: zuvio_kids
description: ZuvioKids — A Flutter kids learning app built with Clean Architecture and Riverpod.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── State Management ────────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ── Functional Programming (Either / Option) ───────────────────────────
  fpdart: ^1.1.0

  # ── Networking ──────────────────────────────────────────────────────────
  dio: ^5.8.0+1

  # ── Local Storage ───────────────────────────────────────────────────────
  shared_preferences: ^2.5.3

  # ── Image Caching ───────────────────────────────────────────────────────
  cached_network_image: ^3.4.1

  # ── Icons ───────────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8

  # ── Internationalisation ────────────────────────────────────────────────
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.2
  build_runner: ^2.4.15

flutter:
  generate: true
  uses-material-design: true

  # assets:
  #   - assets/images/
  #   - assets/lottie/
  #   - assets/audio/

  # fonts:
