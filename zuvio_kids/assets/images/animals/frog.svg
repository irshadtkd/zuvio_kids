<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="frogGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8BC34A"/>
      <stop offset="100%" stop-color="#689F38"/>
    </linearGradient>
    <linearGradient id="frogBelly" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DCEDC8"/>
      <stop offset="100%" stop-color="#C5E1A5"/>
    </linearGradient>
  </defs>

  <!-- Big Bulging Eyeballs on top -->
  <circle cx="85" cy="78" r="24" fill="url(#frogGreen)" stroke="#558B2F" stroke-width="4"/>
  <circle cx="85" cy="78" r="16" fill="#FFFFFF"/>
  <circle cx="85" cy="78" r="9" fill="#212121"/>
  <circle cx="82" cy="74" r="3.5" fill="#FFFFFF"/>

  <circle cx="155" cy="78" r="24" fill="url(#frogGreen)" stroke="#558B2F" stroke-width="4"/>
  <circle cx="155" cy="78" r="16" fill="#FFFFFF"/>
  <circle cx="155" cy="78" r="9" fill="#212121"/>
  <circle cx="152" cy="74" r="3.5" fill="#FFFFFF"/>

  <!-- Back Legs / Thighs -->
  <ellipse cx="65" cy="175" rx="26" ry="32" fill="url(#frogGreen)" stroke="#558B2F" stroke-width="3.5"/>
  <ellipse cx="175" cy="175" rx="26" ry="32" fill="url(#frogGreen)" stroke="#558B2F" stroke-width="3.5"/>

  <!-- Webbed Feet at bottom -->
  <g fill="url(#frogGreen)" stroke="#558B2F" stroke-width="2.5">
    <circle cx="50" cy="208" r="7"/>
    <circle cx="62" cy="210" r="7"/>
    <circle cx="74" cy="208" r="7"/>

    <circle cx="166" cy="208" r="7"/>
    <circle cx="178" cy="210" r="7"/>
    <circle cx="190" cy="208" r="7"/>
  </g>

  <!-- Main Body / Head -->
  <ellipse cx="120" cy="138" rx="64" ry="50" fill="url(#frogGreen)" stroke="#558B2F" stroke-width="4"/>

  <!-- Light Tummy Patch -->
  <ellipse cx="120" cy="158" rx="38" ry="26" fill="url(#frogBelly)"/>

  <!-- Nostrils -->
  <circle cx="114" cy="116" r="2.5" fill="#33691E"/>
  <circle cx="126" cy="116" r="2.5" fill="#33691E"/>

  <!-- Huge Happy Smile -->
  <path d="M 82 128 Q 120 162 158 128" stroke="#33691E" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Cheeks Blush -->
  <circle cx="78" cy="132" r="9" fill="#FF8A80" opacity="0.6"/>
  <circle cx="162" cy="132" r="9" fill="#FF8A80" opacity="0.6"/>
</svg>
