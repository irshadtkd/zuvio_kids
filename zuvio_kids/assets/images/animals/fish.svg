<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="fishOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7043"/>
      <stop offset="100%" stop-color="#F4511E"/>
    </linearGradient>
    <radialGradient id="fishBubble" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#E1F5FE"/>
      <stop offset="100%" stop-color="#4FC3F7"/>
    </radialGradient>
  </defs>

  <!-- Water Bubbles -->
  <circle cx="205" cy="55" r="9" fill="url(#fishBubble)" opacity="0.8"/>
  <circle cx="218" cy="85" r="6" fill="url(#fishBubble)" opacity="0.8"/>
  <circle cx="195" cy="95" r="4.5" fill="url(#fishBubble)" opacity="0.8"/>

  <!-- Top Fin -->
  <path d="M 90 85 Q 120 40 150 78 Z" fill="#FF8A65" stroke="#D84315" stroke-width="3"/>

  <!-- Bottom Fin -->
  <path d="M 105 155 Q 125 190 145 160 Z" fill="#FF8A65" stroke="#D84315" stroke-width="3"/>

  <!-- Tail Fin -->
  <path d="M 65 120 C 30 75 15 90 20 120 C 15 150 30 165 65 120 Z" fill="#FF8A65" stroke="#D84315" stroke-width="3"/>
  <path d="M 40 105 Q 55 120 40 135" stroke="#FFFFFF" stroke-width="3" fill="none"/>

  <!-- Fish Main Body -->
  <ellipse cx="125" cy="120" rx="65" ry="46" fill="url(#fishOrange)" stroke="#D84315" stroke-width="4"/>

  <!-- White Striping with dark borders -->
  <path d="M 120 75 Q 132 120 120 165 Q 108 120 120 75 Z" fill="#FFFFFF" stroke="#212121" stroke-width="2.5"/>
  <path d="M 80 88 Q 90 120 80 152 Q 72 120 80 88 Z" fill="#FFFFFF" stroke="#212121" stroke-width="2"/>

  <!-- Pectoral Side Fin -->
  <path d="M 128 124 C 112 135 110 150 124 148 C 138 146 142 132 128 124 Z" fill="#FFAB91" stroke="#D84315" stroke-width="2"/>

  <!-- Big Innocent Eye -->
  <ellipse cx="162" cy="108" rx="10" ry="12" fill="#212121"/>
  <circle cx="158" cy="104" r="4" fill="#FFFFFF"/>
  <circle cx="164" cy="112" r="1.5" fill="#FFFFFF"/>

  <!-- Cute Kissy Smiling Lips -->
  <path d="M 188 116 Q 196 112 188 122 Q 196 132 188 128" stroke="#D84315" stroke-width="3.5" fill="#FF8A80" stroke-linecap="round"/>

  <!-- Cheerful Blush -->
  <circle cx="150" cy="128" r="8" fill="#FF5252" opacity="0.45"/>
</svg>
