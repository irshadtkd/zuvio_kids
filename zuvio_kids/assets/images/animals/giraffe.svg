<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="giraffeSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFCA28"/>
    </linearGradient>
  </defs>

  <!-- Ossicones (Horns with knobs) -->
  <line x1="105" y1="65" x2="100" y2="35" stroke="#FFB300" stroke-width="5" stroke-linecap="round"/>
  <circle cx="100" cy="32" r="8" fill="#6D4C41"/>

  <line x1="135" y1="65" x2="140" y2="35" stroke="#FFB300" stroke-width="5" stroke-linecap="round"/>
  <circle cx="140" cy="32" r="8" fill="#6D4C41"/>

  <!-- Horizontal Ears -->
  <path d="M 85 75 C 50 68 55 92 82 85 Z" fill="url(#giraffeSkin)" stroke="#FFA000" stroke-width="2.5"/>
  <path d="M 80 77 C 60 72 62 88 78 84 Z" fill="#FF8A80"/>

  <path d="M 155 75 C 190 68 185 92 158 85 Z" fill="url(#giraffeSkin)" stroke="#FFA000" stroke-width="2.5"/>
  <path d="M 160 77 C 180 72 178 88 162 84 Z" fill="#FF8A80"/>

  <!-- Little Mane on back of neck -->
  <g fill="#8D6E63">
    <rect x="94" y="125" width="8" height="10" rx="4"/>
    <rect x="94" y="145" width="8" height="10" rx="4"/>
    <rect x="94" y="165" width="8" height="10" rx="4"/>
    <rect x="94" y="185" width="8" height="10" rx="4"/>
  </g>

  <!-- Neck and Shoulders -->
  <path d="M 102 110 L 100 215 Q 120 225 140 215 L 138 110 Z" fill="url(#giraffeSkin)" stroke="#FFA000" stroke-width="4"/>

  <!-- Neck Spots -->
  <circle cx="118" cy="140" r="9" fill="#8D6E63"/>
  <circle cx="122" cy="170" r="11" fill="#8D6E63"/>
  <circle cx="116" cy="200" r="10" fill="#8D6E63"/>

  <!-- Head -->
  <path d="M 95 75 Q 120 60 145 75 Q 155 110 140 125 Q 120 132 100 125 Q 85 110 95 75 Z" fill="url(#giraffeSkin)" stroke="#FFA000" stroke-width="4"/>

  <!-- Cheerful Eyes with Lashes -->
  <ellipse cx="106" cy="90" rx="6.5" ry="8.5" fill="#212121"/>
  <circle cx="104" cy="87" r="2.5" fill="#FFFFFF"/>
  <path d="M 98 84 L 102 86" stroke="#212121" stroke-width="2" stroke-linecap="round"/>

  <ellipse cx="134" cy="90" rx="6.5" ry="8.5" fill="#212121"/>
  <circle cx="132" cy="87" r="2.5" fill="#FFFFFF"/>
  <path d="M 142 84 L 138 86" stroke="#212121" stroke-width="2" stroke-linecap="round"/>

  <!-- Rounded Muzzle -->
  <ellipse cx="120" cy="116" rx="22" ry="14" fill="#FFE0B2" stroke="#FFB74D" stroke-width="2"/>
  <circle cx="113" cy="113" r="3" fill="#6D4C41"/>
  <circle cx="127" cy="113" r="3" fill="#6D4C41"/>
  <path d="M 114 122 Q 120 126 126 122" stroke="#6D4C41" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Blush -->
  <circle cx="92" cy="106" r="6" fill="#FF8A80" opacity="0.5"/>
  <circle cx="148" cy="106" r="6" fill="#FF8A80" opacity="0.5"/>
</svg>
