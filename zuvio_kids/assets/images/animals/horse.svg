<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="horseCoat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A1887F"/>
      <stop offset="100%" stop-color="#8D6E63"/>
    </linearGradient>
    <linearGradient id="horseMane" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5D4037"/>
      <stop offset="100%" stop-color="#3E2723"/>
    </linearGradient>
  </defs>

  <!-- Left Upright Ear -->
  <polygon points="75,85 62,35 95,65" fill="url(#horseCoat)" stroke="#5D4037" stroke-width="3.5" stroke-linejoin="round"/>
  <polygon points="76,80 68,48 90,66" fill="#D7CCC8"/>

  <!-- Right Upright Ear -->
  <polygon points="125,75 138,25 145,65" fill="url(#horseCoat)" stroke="#5D4037" stroke-width="3.5" stroke-linejoin="round"/>
  <polygon points="128,70 136,38 142,66" fill="#D7CCC8"/>

  <!-- Flowing Mane (Behind Neck) -->
  <g fill="url(#horseMane)">
    <circle cx="70" cy="95" r="18"/>
    <circle cx="62" cy="120" r="19"/>
    <circle cx="58" cy="148" r="20"/>
    <circle cx="60" cy="176" r="18"/>
  </g>

  <!-- Neck and Body -->
  <path d="M 85 95 L 75 190 Q 120 205 165 190 L 145 120 Z" fill="url(#horseCoat)" stroke="#5D4037" stroke-width="4"/>

  <!-- Forelock (Hair tuft in front) -->
  <path d="M 95 60 Q 90 90 105 85 Q 115 80 110 58 Z" fill="url(#horseMane)"/>

  <!-- Head -->
  <path d="M 85 85 L 140 75 Q 175 110 160 145 L 125 155 Q 85 135 85 85 Z" fill="url(#horseCoat)" stroke="#5D4037" stroke-width="4"/>

  <!-- White Star / Blaze on Forehead -->
  <polygon points="112,85 116,95 126,97 118,104 121,114 112,108 103,114 106,104 98,97 108,95" fill="#FFFFFF"/>

  <!-- Muzzle -->
  <ellipse cx="145" cy="148" rx="22" ry="16" fill="#D7CCC8" stroke="#BCAAA4" stroke-width="2"/>
  <circle cx="142" cy="144" r="3.5" fill="#5D4037"/>
  <circle cx="155" cy="142" r="3.5" fill="#5D4037"/>
  <path d="M 136 154 Q 146 160 156 152" stroke="#5D4037" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Kind Eye -->
  <ellipse cx="112" cy="108" rx="8" ry="10" fill="#212121"/>
  <circle cx="109" cy="104" r="3" fill="#FFFFFF"/>
  <circle cx="113" cy="111" r="1.3" fill="#FFFFFF"/>

  <!-- Blush -->
  <circle cx="95" cy="125" r="7" fill="#FF8A80" opacity="0.45"/>
</svg>
