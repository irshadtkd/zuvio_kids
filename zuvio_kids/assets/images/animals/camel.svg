<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="camelCoat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0A96D"/>
      <stop offset="100%" stop-color="#C68A4C"/>
    </linearGradient>
  </defs>

  <!-- Big Soft Hump (Back) -->
  <path d="M 45 160 C 45 95 105 95 110 160 Z" fill="url(#camelCoat)" stroke="#8D5B28" stroke-width="4"/>

  <!-- Body -->
  <ellipse cx="105" cy="174" rx="58" ry="38" fill="url(#camelCoat)" stroke="#8D5B28" stroke-width="4"/>

  <!-- Curved Long Neck -->
  <path d="M 125 180 C 145 180 160 140 155 105 L 135 105 C 135 140 120 175 110 180 Z" fill="url(#camelCoat)" stroke="#8D5B28" stroke-width="4"/>

  <!-- Tuft of hair on top of head -->
  <path d="M 160 62 Q 165 48 155 46 Q 150 56 152 62 Z" fill="#8D5B28"/>

  <!-- Head -->
  <ellipse cx="168" cy="80" rx="28" ry="22" fill="url(#camelCoat)" stroke="#8D5B28" stroke-width="4"/>

  <!-- Drooping Soft Ear -->
  <path d="M 148 72 C 132 68 132 88 145 82 Z" fill="url(#camelCoat)" stroke="#8D5B28" stroke-width="2.5"/>
  <path d="M 146 73 C 136 70 136 84 144 80 Z" fill="#FFCDD2"/>

  <!-- Friendly Sleepy Cartoon Eye with Long Lashes -->
  <path d="M 158 76 Q 166 70 174 76" stroke="#212121" stroke-width="3" stroke-linecap="round" fill="none"/>
  <line x1="162" y1="72" x2="160" y2="67" stroke="#212121" stroke-width="2" stroke-linecap="round"/>
  <line x1="168" y1="71" x2="169" y2="66" stroke="#212121" stroke-width="2" stroke-linecap="round"/>

  <!-- Camel Snout & Smile -->
  <ellipse cx="186" cy="88" rx="14" ry="11" fill="#FFE0B2"/>
  <circle cx="188" cy="85" r="2.5" fill="#5D4037"/>
  <path d="M 182 92 Q 188 98 194 92" stroke="#5D4037" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Cheeks Blush -->
  <circle cx="165" cy="92" r="6" fill="#FF8A80" opacity="0.5"/>
</svg>
