<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="eleSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#90CAF9"/>
      <stop offset="100%" stop-color="#64B5F6"/>
    </linearGradient>
    <linearGradient id="eleEar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFCDD2"/>
      <stop offset="100%" stop-color="#F8BBD0"/>
    </linearGradient>
    <radialGradient id="waterDrop" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#E1F5FE"/>
      <stop offset="100%" stop-color="#29B6F6"/>
    </radialGradient>
  </defs>

  <!-- Left Ear (Back) -->
  <path d="M 65 80 C 15 70 5 150 55 160 C 65 162 70 145 68 130 Z" fill="url(#eleSkin)" stroke="#42A5F5" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 60 90 C 25 82 18 140 52 148 C 60 150 63 138 62 128 Z" fill="url(#eleEar)"/>

  <!-- Right Ear (Back) -->
  <path d="M 175 80 C 225 70 235 150 185 160 C 175 162 170 145 172 130 Z" fill="url(#eleSkin)" stroke="#42A5F5" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 180 90 C 215 82 222 140 188 148 C 180 150 177 138 178 128 Z" fill="url(#eleEar)"/>

  <!-- Body -->
  <ellipse cx="120" cy="170" rx="65" ry="55" fill="url(#eleSkin)" stroke="#42A5F5" stroke-width="4"/>

  <!-- Feet / Toes -->
  <circle cx="85" cy="210" r="12" fill="#E3F2FD" stroke="#90CAF9" stroke-width="2"/>
  <circle cx="120" cy="214" r="12" fill="#E3F2FD" stroke="#90CAF9" stroke-width="2"/>
  <circle cx="155" cy="210" r="12" fill="#E3F2FD" stroke="#90CAF9" stroke-width="2"/>

  <!-- Head -->
  <ellipse cx="120" cy="110" rx="55" ry="48" fill="url(#eleSkin)" stroke="#42A5F5" stroke-width="4"/>

  <!-- Tusks -->
  <path d="M 98 145 Q 86 160 82 170 Q 95 165 104 153 Z" fill="#FFFDE7" stroke="#FFE082" stroke-width="2"/>
  <path d="M 142 145 Q 154 160 158 170 Q 145 165 136 153 Z" fill="#FFFDE7" stroke="#FFE082" stroke-width="2"/>

  <!-- Trunk with cute curl up -->
  <path d="M 108 132 C 108 170 140 185 150 165 C 156 150 144 140 138 145 C 132 150 134 160 128 155 C 122 150 118 135 128 132 Z" fill="url(#eleSkin)" stroke="#42A5F5" stroke-width="4" stroke-linejoin="round"/>

  <!-- Cheeks Blush -->
  <circle cx="82" cy="125" r="10" fill="#FF8A80" opacity="0.45"/>
  <circle cx="158" cy="125" r="10" fill="#FF8A80" opacity="0.45"/>

  <!-- Left Eye -->
  <ellipse cx="98" cy="98" rx="8" ry="11" fill="#1A237E"/>
  <circle cx="95" cy="94" r="3.5" fill="#FFFFFF"/>
  <circle cx="101" cy="103" r="1.5" fill="#FFFFFF"/>

  <!-- Right Eye -->
  <ellipse cx="142" cy="98" rx="8" ry="11" fill="#1A237E"/>
  <circle cx="139" cy="94" r="3.5" fill="#FFFFFF"/>
  <circle cx="145" cy="103" r="1.5" fill="#FFFFFF"/>

  <!-- Cute water droplets from trunk -->
  <path d="M 160 135 Q 166 122 163 118 Q 155 126 160 135 Z" fill="url(#waterDrop)"/>
  <circle cx="172" cy="128" r="4" fill="url(#waterDrop)"/>
  <circle cx="166" cy="144" r="3" fill="url(#waterDrop)"/>
</svg>
