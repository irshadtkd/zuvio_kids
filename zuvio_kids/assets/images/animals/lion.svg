<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="lionMane" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA000"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="lionFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFCA28"/>
    </linearGradient>
  </defs>

  <!-- Fluffy Cloud-like Mane -->
  <g fill="url(#lionMane)" stroke="#BF360C" stroke-width="3">
    <circle cx="120" cy="50" r="26"/>
    <circle cx="156" cy="58" r="25"/>
    <circle cx="184" cy="80" r="25"/>
    <circle cx="196" cy="114" r="25"/>
    <circle cx="186" cy="148" r="25"/>
    <circle cx="158" cy="172" r="25"/>
    <circle cx="120" cy="180" r="25"/>
    <circle cx="82" cy="172" r="25"/>
    <circle cx="54" cy="148" r="25"/>
    <circle cx="44" cy="114" r="25"/>
    <circle cx="56" cy="80" r="25"/>
    <circle cx="84" cy="58" r="25"/>
    <circle cx="120" cy="114" r="66"/>
  </g>

  <!-- Left Round Ear -->
  <circle cx="75" cy="74" r="16" fill="url(#lionFace)" stroke="#FFA000" stroke-width="3"/>
  <circle cx="75" cy="74" r="9" fill="#FF8A80" opacity="0.7"/>

  <!-- Right Round Ear -->
  <circle cx="165" cy="74" r="16" fill="url(#lionFace)" stroke="#FFA000" stroke-width="3"/>
  <circle cx="165" cy="74" r="9" fill="#FF8A80" opacity="0.7"/>

  <!-- Face -->
  <ellipse cx="120" cy="118" rx="46" ry="42" fill="url(#lionFace)" stroke="#FFB300" stroke-width="3"/>

  <!-- White Muzzle -->
  <ellipse cx="108" cy="134" rx="14" ry="10" fill="#FFF9C4"/>
  <ellipse cx="132" cy="134" rx="14" ry="10" fill="#FFF9C4"/>

  <!-- Cute Eyes -->
  <ellipse cx="100" cy="108" rx="7.5" ry="10" fill="#3E2723"/>
  <circle cx="98" cy="104" r="3" fill="#FFFFFF"/>
  <circle cx="102" cy="112" r="1.5" fill="#FFFFFF"/>

  <ellipse cx="140" cy="108" rx="7.5" ry="10" fill="#3E2723"/>
  <circle cx="138" cy="104" r="3" fill="#FFFFFF"/>
  <circle cx="142" cy="112" r="1.5" fill="#FFFFFF"/>

  <!-- Nose & Mouth -->
  <polygon points="120,126 112,118 128,118" fill="#5D4037"/>
  <path d="M 120 126 L 120 134 M 120 134 Q 112 142 104 136 M 120 134 Q 128 142 136 136" stroke="#5D4037" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Cheeks Blush -->
  <circle cx="86" cy="128" r="7" fill="#FF8A80" opacity="0.5"/>
  <circle cx="154" cy="128" r="7" fill="#FF8A80" opacity="0.5"/>

  <!-- Paws peeking at bottom -->
  <circle cx="95" cy="208" r="15" fill="url(#lionFace)" stroke="#FFA000" stroke-width="3"/>
  <circle cx="145" cy="208" r="15" fill="url(#lionFace)" stroke="#FFA000" stroke-width="3"/>
</svg>
