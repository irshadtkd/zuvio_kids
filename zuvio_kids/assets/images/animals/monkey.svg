<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="monkeyDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8D6E63"/>
      <stop offset="100%" stop-color="#6D4C41"/>
    </linearGradient>
    <linearGradient id="monkeyLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE0B2"/>
      <stop offset="100%" stop-color="#FFCC80"/>
    </linearGradient>
  </defs>

  <!-- Curled Tail in Background -->
  <path d="M 68 180 C 15 180 15 110 50 115 C 65 118 60 138 48 134 C 32 130 35 165 72 165 Z" fill="url(#monkeyDark)" stroke="#4E342E" stroke-width="2"/>

  <!-- Left Round Big Ear -->
  <circle cx="58" cy="105" r="25" fill="url(#monkeyDark)" stroke="#4E342E" stroke-width="3.5"/>
  <circle cx="58" cy="105" r="15" fill="url(#monkeyLight)"/>

  <!-- Right Round Big Ear -->
  <circle cx="182" cy="105" r="25" fill="url(#monkeyDark)" stroke="#4E342E" stroke-width="3.5"/>
  <circle cx="182" cy="105" r="15" fill="url(#monkeyLight)"/>

  <!-- Body -->
  <ellipse cx="120" cy="174" rx="52" ry="44" fill="url(#monkeyDark)" stroke="#4E342E" stroke-width="4"/>
  <!-- Belly -->
  <ellipse cx="120" cy="178" rx="34" ry="28" fill="url(#monkeyLight)"/>

  <!-- Head Base -->
  <circle cx="120" cy="106" r="50" fill="url(#monkeyDark)" stroke="#4E342E" stroke-width="4"/>

  <!-- Top hair tuft -->
  <path d="M 120 56 Q 124 45 120 40 Q 115 48 116 56 Z" fill="url(#monkeyDark)"/>

  <!-- Heart-shaped Face Mask -->
  <path d="M 120 85 C 105 68 80 72 80 94 C 80 118 100 136 120 145 C 140 136 160 118 160 94 C 160 72 135 68 120 85 Z" fill="url(#monkeyLight)"/>

  <!-- Eyes -->
  <ellipse cx="102" cy="98" rx="7.5" ry="10" fill="#212121"/>
  <circle cx="99" cy="94" r="3" fill="#FFFFFF"/>
  <circle cx="103" cy="102" r="1.3" fill="#FFFFFF"/>

  <ellipse cx="138" cy="98" rx="7.5" ry="10" fill="#212121"/>
  <circle cx="135" cy="94" r="3" fill="#FFFFFF"/>
  <circle cx="139" cy="102" r="1.3" fill="#FFFFFF"/>

  <!-- Nose & Big Cheeky Grin -->
  <circle cx="116" cy="116" r="2.5" fill="#5D4037"/>
  <circle cx="124" cy="116" r="2.5" fill="#5D4037"/>
  <path d="M 96 122 Q 120 144 144 122" stroke="#5D4037" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Blush -->
  <circle cx="85" cy="118" r="7" fill="#FF8A80" opacity="0.5"/>
  <circle cx="155" cy="118" r="7" fill="#FF8A80" opacity="0.5"/>
</svg>
