<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="parrotRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="100%" stop-color="#D50000"/>
    </linearGradient>
    <linearGradient id="parrotWing" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD600"/>
      <stop offset="50%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#2979FF"/>
    </linearGradient>
  </defs>

  <!-- Tail Feathers -->
  <path d="M 70 170 Q 50 215 45 230 Q 65 210 80 180 Z" fill="#2979FF" stroke="#1565C0" stroke-width="2"/>
  <path d="M 80 175 Q 65 220 60 232 Q 78 205 90 180 Z" fill="#00E676" stroke="#00C853" stroke-width="2"/>

  <!-- Perch Branch -->
  <rect x="25" y="200" width="190" height="12" rx="6" fill="#8D6E63"/>

  <!-- Feet Claws -->
  <circle cx="110" cy="200" r="5" fill="#FFA000"/>
  <circle cx="120" cy="200" r="5" fill="#FFA000"/>
  <circle cx="130" cy="200" r="5" fill="#FFA000"/>

  <!-- Body -->
  <ellipse cx="120" cy="145" rx="42" ry="52" fill="url(#parrotRed)" stroke="#B71C1C" stroke-width="3.5"/>

  <!-- Multi-color Wing -->
  <path d="M 90 120 C 80 145 85 180 115 182 C 115 160 110 135 105 120 Z" fill="url(#parrotWing)" stroke="#388E3C" stroke-width="2.5"/>

  <!-- Head Plume Crest -->
  <path d="M 125 55 Q 115 32 100 38 Q 112 50 120 65 Z" fill="#FFD600" stroke="#F57F17" stroke-width="2"/>
  <path d="M 132 58 Q 130 30 118 32 Q 124 48 128 65 Z" fill="url(#parrotRed)" stroke="#B71C1C" stroke-width="2"/>

  <!-- Head -->
  <circle cx="132" cy="85" r="32" fill="url(#parrotRed)" stroke="#B71C1C" stroke-width="3.5"/>

  <!-- White Eye Patch -->
  <ellipse cx="126" cy="82" rx="14" ry="16" fill="#FFFFFF"/>

  <!-- Eye -->
  <circle cx="126" cy="82" r="6" fill="#212121"/>
  <circle cx="124" cy="79" r="2.5" fill="#FFFFFF"/>

  <!-- Curved Hooked Beak -->
  <path d="M 152 74 C 180 78 185 105 162 112 C 158 102 154 90 152 74 Z" fill="#FFF59D" stroke="#FBC02D" stroke-width="2.5"/>
  <path d="M 154 98 Q 165 102 152 108 Z" fill="#424242"/>

  <!-- Cheek Blush -->
  <circle cx="118" cy="100" r="6" fill="#FF8A80" opacity="0.6"/>
</svg>
