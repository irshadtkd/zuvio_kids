<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="dogFur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB74D"/>
      <stop offset="100%" stop-color="#FFA726"/>
    </linearGradient>
    <linearGradient id="dogEarColor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8D6E63"/>
      <stop offset="100%" stop-color="#6D4C41"/>
    </linearGradient>
  </defs>

  <!-- Left Floppy Ear -->
  <path d="M 80 75 C 45 75 35 125 50 155 C 60 170 75 160 76 130 Z" fill="url(#dogEarColor)" stroke="#4E342E" stroke-width="3.5"/>

  <!-- Right Floppy Ear -->
  <path d="M 160 75 C 195 75 205 125 190 155 C 180 170 165 160 164 130 Z" fill="url(#dogEarColor)" stroke="#4E342E" stroke-width="3.5"/>

  <!-- Body -->
  <ellipse cx="120" cy="174" rx="55" ry="45" fill="url(#dogFur)" stroke="#F57C00" stroke-width="4"/>
  <!-- White Chest -->
  <ellipse cx="120" cy="180" rx="30" ry="28" fill="#FFF9C4"/>

  <!-- Paws -->
  <circle cx="92" cy="208" r="14" fill="#FFFFFF" stroke="#FFA726" stroke-width="3"/>
  <circle cx="148" cy="208" r="14" fill="#FFFFFF" stroke="#FFA726" stroke-width="3"/>

  <!-- Head -->
  <ellipse cx="120" cy="110" rx="54" ry="46" fill="url(#dogFur)" stroke="#F57C00" stroke-width="4"/>

  <!-- Eye Patch (over left eye) -->
  <path d="M 88 88 C 70 90 70 120 90 122 C 108 120 108 90 88 88 Z" fill="url(#dogEarColor)" opacity="0.85"/>

  <!-- Eyes -->
  <ellipse cx="94" cy="102" rx="7.5" ry="10" fill="#FFFFFF"/>
  <ellipse cx="94" cy="102" rx="5" ry="8" fill="#212121"/>
  <circle cx="92" cy="98" r="2.5" fill="#FFFFFF"/>

  <ellipse cx="146" cy="102" rx="7.5" ry="10" fill="#212121"/>
  <circle cx="143" cy="98" r="3" fill="#FFFFFF"/>
  <circle cx="147" cy="105" r="1.3" fill="#FFFFFF"/>

  <!-- White Muzzle -->
  <ellipse cx="120" cy="132" rx="28" ry="18" fill="#FFFFFF"/>

  <!-- Shiny Nose -->
  <ellipse cx="120" cy="123" rx="10" ry="7" fill="#212121"/>
  <circle cx="117" cy="121" r="2" fill="#FFFFFF"/>

  <!-- Open Smile with Tongue -->
  <path d="M 112 130 Q 120 136 128 130" stroke="#212121" stroke-width="2.5" fill="none"/>
  <!-- Tongue -->
  <path d="M 115 133 C 115 146 125 146 125 133 Z" fill="#FF5252" stroke="#D32F2F" stroke-width="1.5"/>

  <!-- Cheeks Blush -->
  <circle cx="78" cy="124" r="7" fill="#FF8A80" opacity="0.5"/>
  <circle cx="162" cy="124" r="7" fill="#FF8A80" opacity="0.5"/>
</svg>
