<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="zebraCoat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F5F5"/>
    </linearGradient>
  </defs>

  <!-- Left Ear -->
  <polygon points="75,85 62,35 95,65" fill="url(#zebraCoat)" stroke="#212121" stroke-width="3.5" stroke-linejoin="round"/>
  <polygon points="76,80 68,48 90,66" fill="#FFCDD2"/>

  <!-- Right Ear -->
  <polygon points="125,75 138,25 145,65" fill="url(#zebraCoat)" stroke="#212121" stroke-width="3.5" stroke-linejoin="round"/>
  <polygon points="128,70 136,38 142,66" fill="#FFCDD2"/>

  <!-- Spiky Mane along Crest -->
  <g fill="#212121">
    <polygon points="75,65 60,78 78,82"/>
    <polygon points="70,90 52,105 72,110"/>
    <polygon points="65,118 46,132 68,138"/>
    <polygon points="60,145 42,160 65,166"/>
  </g>

  <!-- Neck and Body -->
  <path d="M 85 95 L 75 190 Q 120 205 165 190 L 145 120 Z" fill="url(#zebraCoat)" stroke="#212121" stroke-width="4"/>

  <!-- Neck Stripes -->
  <polygon points="78,140 115,145 110,152 76,148" fill="#212121"/>
  <polygon points="75,165 125,168 120,176 74,173" fill="#212121"/>

  <!-- Head -->
  <path d="M 85 85 L 140 75 Q 175 110 160 145 L 125 155 Q 85 135 85 85 Z" fill="url(#zebraCoat)" stroke="#212121" stroke-width="4"/>

  <!-- Facial Stripes -->
  <polygon points="112,78 120,95 112,93" fill="#212121"/>
  <polygon points="90,105 118,102 115,108 88,112" fill="#212121"/>
  <polygon points="88,125 125,122 122,128 86,132" fill="#212121"/>

  <!-- Muzzle -->
  <ellipse cx="145" cy="148" rx="22" ry="16" fill="#424242"/>
  <circle cx="142" cy="144" r="3" fill="#212121"/>
  <circle cx="155" cy="142" r="3" fill="#212121"/>
  <path d="M 138 152 Q 146 158 154 150" stroke="#FFAB91" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Eye -->
  <ellipse cx="112" cy="106" rx="8" ry="10" fill="#212121"/>
  <circle cx="109" cy="102" r="3" fill="#FFFFFF"/>
  <circle cx="113" cy="109" r="1.3" fill="#FFFFFF"/>

  <!-- Blush -->
  <circle cx="96" cy="122" r="7" fill="#FF8A80" opacity="0.45"/>
</svg>
